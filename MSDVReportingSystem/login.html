<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>MSDV Reporting System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="assets/css/login.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#081F5D">

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>
</head>

<body>

<div class="wrapper">

    <div class="mcclogo">
        <img
            src="assets/images/mccLogo.png"
            alt="MCC Logo"
            class="loginlogo">
    </div>

    <div class="formbox">

        <form method="POST" action="login.php">

            <div class="form-group">
                <label class="form-label" for="usernameInput">
                    USERNAME
                </label>

                <input
                    type="text"
                    name="username"
                    id="usernameInput"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="passwordInput">
                    PASSWORD
                </label>

                <input
                    type="password"
                    name="password"
                    id="passwordInput"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password">
            </div>

            <button type="submit" class="btn">
                SIGN IN
            </button>

        </form>

        <!-- Messages appear below the Sign In button -->
        <div class="message-slot">

            <div id="logoutBox" class="alert alert-info d-none">
                You have been logged out successfully.
            </div>

            <div id="errorBox" class="alert alert-danger d-none">
                <span id="errorText"></span>
            </div>

        </div>

    </div>

</div>

<script>
(function () {
    const params = new URLSearchParams(window.location.search);

    const err = params.get('error');

    const errorBox = document.getElementById('errorBox');
    const logoutBox = document.getElementById('logoutBox');
    const errorText = document.getElementById('errorText');

    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');

    // Show incorrect-login message at the bottom
    if (err) {
        errorText.textContent = err;
        errorBox.classList.remove('d-none');

        usernameInput.classList.add('is-invalid');
        passwordInput.classList.add('is-invalid');
    }

    // Show successful-logout message at the bottom
    if (params.get('logged_out') === '1') {
        logoutBox.classList.remove('d-none');
    }

    // Clean the URL without reloading the page
    if (err || params.has('logged_out')) {
        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );
    }

    // Retrieve a saved username
    function getCookie(name) {
        const cookies = document.cookie.split(';');

        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();

            if (cookie.startsWith(name + '=')) {
                return decodeURIComponent(
                    cookie.substring(name.length + 1)
                );
            }
        }

        return null;
    }

    const savedUsername = getCookie('remember_user');

    if (savedUsername) {
        usernameInput.value = savedUsername;

        const rememberMe = document.getElementById('rememberMe');

        if (rememberMe) {
            rememberMe.checked = true;
        }

        passwordInput.focus();
    }

    // Remove error styling when the user edits a field
    [usernameInput, passwordInput].forEach(function (input) {
        input.addEventListener('input', function () {
            this.classList.remove('is-invalid');
            errorBox.classList.add('d-none');
        });
    });

})();
</script>

</body>
</html>
